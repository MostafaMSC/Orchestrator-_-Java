#
# Built-in defaults. Do NOT edit this file to configure a deployment — it lives
# inside the jar. Put customer settings in config/orchestrator.yml instead
# (or point ORCHESTRATOR_CONFIG_DIR somewhere else); that file is imported below
# and wins over everything here.
#
spring:
  application:
    name: twokeyok-orchestrator
  config:
    import: "optional:file:${ORCHESTRATOR_CONFIG_DIR:./config}/orchestrator.yml"
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB
      file-size-threshold: 1MB
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${ORCHESTRATOR_PORT:8443}
  servlet:
    context-path: /orchestrator
  ssl:
    enabled: ${ORCHESTRATOR_TLS_ENABLED:false}
    key-store: ${ORCHESTRATOR_TLS_KEYSTORE:}
    key-store-password: ${ORCHESTRATOR_TLS_KEYSTORE_PASSWORD:}
    key-store-type: ${ORCHESTRATOR_TLS_KEYSTORE_TYPE:PKCS12}
    enabled-protocols: TLSv1.3,TLSv1.2
  max-http-header-size: 100KB
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200
    max-swallow-size: -1
    connection-timeout: 60s
  error:
    path: /error
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    '[iq.twokeyok.orchestrator]': INFO
    '[com.ascertia]': WARN

#
# Signing defaults. Keys mirror the deployed Ascertia Orchestrator configuration
# so an existing file drops in; see docs/CONFIGURATION.md for the ones this
# product implements.
#
signing:
  debug-mode: false
  basic-auth-type: implicit
  default_credential_strategy: LATEST
  gateway:
    url: http://localhost:8777/adss/signing/hdsi
    client_id: Orchestrator-Signing
    request_mode: HTTP
    timeout_ms: 120000
    retries: 1
    status_polling:
      interval_ms: 3000
      max_attempts: 60
  verification:
    request_mode: 2
  dss:
    signature:
      compute_hash: true
      local_hash: false
      hash_algorithm: SHA256
      dictionary_size: 12000
      signature_level: PAdES_BASELINE_B
      signature_field_name: Signature1
      signing_page: 1
      container_type: NONE
      data_to_be_displayed: Please authorise this signing transaction
      appearance:
        enabled: true
        use_default: true
        store-path: ${ORCHESTRATOR_CONFIG_DIR:./config}/appearances
        reload-always: false
  limits:
    max-files-per-request: 20
    max-file-size-bytes: 26214400
    max-total-request-bytes: 104857600
    max-concurrent-signing-requests: 8

csc-config:
  require-authentication: true
  cache-expiry: 60
  bearer:
    enabled: false
